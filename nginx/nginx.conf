# AirPrint PDF Stack - Nginx Configuration
# Serves the PDF Gallery web interface and provides API endpoints

# Run as nginx user
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # File upload size (for potential future use)
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Main page - PDF Gallery
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # PDF files - direct access with directory listing
        location /pdfs {
            alias /pdfs;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            # Proper MIME type for PDFs
            types {
                application/pdf pdf;
            }

            # Allow viewing PDFs inline
            add_header Content-Disposition "inline" always;

            # Cache PDFs
            expires 1h;
            add_header Cache-Control "public";
        }

        # API endpoint - JSON list of PDFs
        location /api/pdfs {
            alias /pdfs;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size on;
            autoindex_localtime off;

            # CORS headers for API
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Content-Type "application/json" always;

            # No caching for API responses
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
